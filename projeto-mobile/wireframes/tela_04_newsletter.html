<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tela_04 — Newsletter</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <main class="screen">

    <header class="header">
      <a href="tela_01_home.html" class="header__back">‹</a>
      <span class="header__title">Assinar newsletter</span>
    </header>

    <div class="screen__body">

      <div class="placeholder" style="height:120px;">Ilustração</div>

      <div>
        <h2 class="section__title">Receba as novidades</h2>
        <p class="text-muted">Enviamos os melhores conteúdos direto no seu e-mail.</p>
      </div>

      <!-- Bloco: form (variação newsletter) -->
      <form class="form form--newsletter">
        <div class="form__group">
          <label class="form__label" for="email">E-mail</label>
          <input class="form__input" id="email" type="email" placeholder="voce@email.com">
        </div>

        <label class="form__check">
          <input type="checkbox">
          <span>Concordo em receber e-mails e com as condições apresentadas.</span>
        </label>

        <div class="form__actions">
          <button type="submit" class="button button--primary button--block">Confirmar assinatura</button>
        </div>
      </form>

    </div>

    <nav class="nav">
      <a href="tela_01_home.html" class="nav__item"><span class="nav__icon">⌂</span><span class="nav__label">Início</span></a>
      <a href="tela_03_destaques.html" class="nav__item"><span class="nav__icon">★</span><span class="nav__label">Destaques</span></a>
      <a href="tela_11_busca.html" class="nav__item"><span class="nav__icon">🔍</span><span class="nav__label">Buscar</span></a>
      <a href="tela_12_login.html" class="nav__item"><span class="nav__icon">◔</span><span class="nav__label">Entrar</span></a>
    </nav>

  </main>
</body>
</html>
